<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéVault — Tracker Collezione GCC (Occidentale & Giapponese)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #eab308;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 4rem;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pokeball-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ef4444 48%, #1e293b 48%, #1e293b 52%, #f8fafc 52%);
      border: 2px solid #f8fafc;
      position: relative;
      flex-shrink: 0;
    }
    .pokeball-icon::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f8fafc;
      border: 2px solid #1e293b;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { font-size: 0.8rem; color: var(--text-muted); display: block; }

    /* Region Switcher */
    .region-tabs {
      display: flex;
      background: var(--bg);
      padding: 0.25rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .region-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .region-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* Backup Actions */
    .header-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover { background: var(--surface-hover); border-color: #475569; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); border-color: var(--success); color: #052e16; }

    /* Stats Bar */
    .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.6rem; font-weight: 800; margin-top: 0.2rem; color: var(--text); }
    .stat-sub { font-size: 0.8rem; color: var(--success); margin-top: 0.15rem; }

    /* Search & Filter Bar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      flex: 1;
      min-width: 240px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }

    /* Series Blocks */
    .series-block {
      margin-bottom: 2.25rem;
    }
    .series-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
    }
    .series-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .series-badge {
      font-size: 0.75rem;
      background: var(--surface);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* Sets Grid */
    .sets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.9rem;
    }
    .set-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .set-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: var(--surface-hover);
    }
    .set-card-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .set-symbol-wrap {
      width: 42px;
      height: 42px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 5px;
    }
    .set-symbol-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .set-symbol-fallback {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
    }
    .set-info h3 {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .set-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .progress-wrap {
      width: 100%;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .progress-bar {
      height: 7px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Set Detail View (Pokellector Card Grid) */
    #set-detail-view { display: none; }
    .back-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .set-detail-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .filter-pills {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 1.1rem;
    }
    .poke-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem;
      position: relative;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .poke-card.owned {
      border-color: var(--success);
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.15);
    }
    .poke-card:hover {
      transform: translateY(-3px);
    }
    .card-img-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 2.5 / 3.5;
      background: #0b1120;
      cursor: pointer;
    }
    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.3s ease, opacity 0.3s ease, transform 0.2s ease;
      filter: grayscale(100%) contrast(85%) brightness(0.75);
      opacity: 0.72;
    }
    .poke-card.owned .card-img-box img {
      filter: none;
      opacity: 1;
    }
    .card-img-box:hover img {
      transform: scale(1.03);
    }

    .flag-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
      transition: all 0.15s;
    }
    .poke-card.owned .flag-btn {
      background: var(--success);
      border-color: #fff;
      color: #052e16;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .card-meta {
      margin-top: 0.6rem;
      cursor: pointer;
    }
    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.3rem;
    }
    .card-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card-name {
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;

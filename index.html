<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéVault TCG — Tracker Collezione</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #eab308;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 4rem;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pokeball-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ef4444 48%, #1e293b 48%, #1e293b 52%, #f8fafc 52%);
      border: 2px solid #f8fafc;
      position: relative;
      flex-shrink: 0;
    }
    .pokeball-icon::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f8fafc;
      border: 2px solid #1e293b;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .brand h1 { font-size: 1.2rem; font-weight: 800; }
    .brand span { font-size: 0.78rem; color: var(--text-muted); display: block; }

    /* Region Switcher Bar in Header */
    .region-container {
      display: flex;
      background: var(--bg);
      padding: 0.3rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .region-tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .region-tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover { background: var(--surface-hover); border-color: #475569; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-success { background: var(--success); border-color: var(--success); color: #052e16; }

    /* Container & Stats */
    .container { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
    }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 0.2rem; }
    .stat-sub { font-size: 0.78rem; color: var(--success); margin-top: 0.15rem; }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }

    /* Series Blocks */
    .series-block { margin-bottom: 2rem; }
    .series-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .series-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
    }
    .series-badge {
      font-size: 0.75rem;
      background: var(--surface);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* Sets Grid */
    .sets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.9rem;
    }
    .set-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .set-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: var(--surface-hover);
    }
    .set-card-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .set-symbol-wrap {
      width: 42px;
      height: 42px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 4px;
    }
    .set-symbol-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .set-symbol-fallback {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
    }
    .set-info h3 { font-size: 0.95rem; font-weight: 700; line-height: 1.25; }
    .set-info span { font-size: 0.76rem; color: var(--text-muted); }

    .progress-wrap { width: 100%; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .progress-bar {
      height: 6px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Set Detail View (Pokellector Grid) */
    #set-detail-view { display: none; }
    .back-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .set-detail-header { display: flex; align-items: center; gap: 1rem; }
    .filter-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 1.1rem;
    }
    .poke-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    }
    .poke-card.owned {
      border-color: var(--success);
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.15);
    }
    .poke-card:hover { transform: translateY(-3px); }
    .card-img-box {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 2.5 / 3.5;
      background: #0b1120;
      cursor: pointer;
    }
    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.3s ease, opacity 0.3s ease;
      /* Carte mancanti desaturate in scala di grigi come richiesto */
      filter: grayscale(100%) contrast(85%) brightness(0.75);
      opacity: 0.72;
    }
    .poke-card.owned .card-img-box img {
      filter: none;
      opacity: 1;
    }
    .flag-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    .poke-card.owned .flag-btn {
      background: var(--success);
      color: #052e16;
    }

    .card-meta { margin-top: 0.6rem; cursor: pointer; }
    .card-title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.3rem; }
    .card-num { font-size: 0.73rem; font-weight: 700; color: var(--accent); }
    .card-name { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
    .tag { font-size: 0.68rem; padding: 0.12rem 0.4rem; border-radius: 6px; background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
    .tag.owned-tag { border-color: rgba(34, 197, 94, 0.4); color: #86efac; }

    /* Loader & Modal */
    .loader-box { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 520px; width: 100%;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 1.25rem; display: grid; grid-template-columns: 140px 1fr; gap: 1.25rem; }
    @media (max-width: 500px) { .modal-body { grid-template-columns: 1fr; } }
    .modal-card-preview img { width: 100%; border-radius: 10px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.25rem; }
    .form-control { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.7rem; border-radius: 8px; font-size: 0.9rem; }
    .checkbox-row { display: flex; align-items: center; gap: 0.6rem; background: var(--bg); padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; margin-bottom: 1rem; }
    .checkbox-row input { width: 18px; height: 18px; accent-color: var(--success); }
    .modal-footer { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 0.6rem; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="pokeball-icon"></div>
      <div>
        <h1>PokéVault TCG</h1>
        <span>Tracker Collezione stile Pokellector</span>
      </div>
    </div>

    <!-- SELETTORE OCCIDENTALE / GIAPPONESE IN EVIDENZA NELL'HEADER -->
    <div class="region-container">
      <button class="region-tab-btn active" id="btn-western" onclick="switchRegion('western')">🌍 Occidentali</button>
      <button class="region-tab-btn" id="btn-japanese" onclick="switchRegion('japanese')">🇯🇵 Giapponesi</button>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="exportData()">⬇️ Esporta</button>
      <button class="btn" onclick="document.getElementById('import-file').click()">⬆️ Importa</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>
</header>

<div class="container">
  <!-- Stats Bar -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Carte (<span id="stat-region-name">Occidentali</span>)</div>
      <div class="stat-value" id="stat-owned-region">0</div>
      <div class="stat-sub" id="stat-total-global">Globale: 0 carte</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Valore Stimato</div>
      <div class="stat-value" id="stat-value-region">€ 0,00</div>
      <div class="stat-sub" id="stat-value-global">Globale: € 0,00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Set Iniziati</div>
      <div class="stat-value" id="stat-sets-started">0</div>
      <div class="stat-sub" id="stat-sets-total">su 0 set</div>
    </div>
  </div>

  <!-- OVERVIEW LIST -->
  <div id="series-overview">
    <div class="toolbar">
      <input type="text" id="search-set-input" class="search-input" placeholder="🔍 Cerca espansione (es. Base Set, 151, Mega Evolution)..." oninput="renderSeries()" />
    </div>
    <div id="series-container"></div>
  </div>

  <!-- SET DETAIL VIEW -->
  <div id="set-detail-view">
    <div class="back-bar">
      <div class="set-detail-header">
        <button class="btn" onclick="closeSetView()">← Tutti i Set</button>
        <div class="set-symbol-wrap" id="detail-set-symbol"></div>
        <div>
          <h2 id="detail-set-title" style="font-size:1.1rem;">Nome Set</h2>
          <span id="detail-set-subtitle" style="font-size:0.78rem; color:var(--text-muted);">Blocco • 0 / 0</span>
        </div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">
        <input type="text" id="search-card-input" class="search-input" style="min-width:170px; padding:0.4rem 0.7rem;" placeholder="Filtra carta..." oninput="renderSetCards()" />
        <div class="filter-pills">
          <button class="pill active" data-filter="all" onclick="setCardFilter('all', this)">Tutte</button>
          <button class="pill" data-filter="owned" onclick="setCardFilter('owned', this)">Possedute</button>
          <button class="pill" data-filter="missing" onclick="setCardFilter('missing', this)">Mancanti</button>
        </div>
      </div>
    </div>

    <div id="cards-loading" class="loader-box" style="display:none;">
      <div class="spinner"></div>
      <p>Caricamento carte del set in corso...</p>
    </div>

    <div id="cards-grid" class="cards-grid"></div>
  </div>
</div>

<!-- MODAL EDIT CARTA -->
<div class="modal-backdrop" id="card-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title" style="font-size:1rem;">Dettagli Carta</h3>
      <button class="btn" onclick="closeModal()" style="padding:0.2rem 0.5rem;">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-card-preview">
        <img id="modal-img" src="" alt="Carta" />
        <p id="modal-card-sub" style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin-top:0.4rem;"></p>
      </div>
      <div>
        <label class="checkbox-row">
          <input type="checkbox" id="modal-owned" />
          <strong>In Collezione (Flaggata)</strong>
        </label>
        <div class="form-group">
          <label>Condizione</label>
          <select id="modal-condition" class="form-control">
            <option value="Mint (M)">Mint (M)</option>
            <option value="Near Mint (NM)" selected>Near Mint (NM)</option>
            <option value="Excellent (EX)">Excellent (EX)</option>
            <option value="Good (GD)">Good (GD)</option>
            <option value="Light Played (LP)">Light Played (LP)</option>
            <option value="Played (PL)">Played (PL)</option>
            <option value="Graded (PSA/BGS)">Graded (PSA / BGS / CGC)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prezzo (€)</label>
          <input type="number" step="0.01" min="0" id="modal-price" class="form-control" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Data di acquisto</label>
          <input type="date" id="modal-date" class="form-control" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn btn-success" onclick="saveCardModal()">Salva</button>
    </div>
  </div>
</div>
